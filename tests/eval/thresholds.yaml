# Eval gates per task (panel 2026-05-24). Lowering any threshold requires the
# compliance CODEOWNERS gate. `labels` is the classification target vocabulary;
# INVOICE_QUERY is declared here per ADR-042 §5b so it cannot silently collapse
# into OTHER once the classifier learns it.
classification:
  labels:
    - CONTRACTUAL_CORRECTION
    - DUPLICATE_PO
    - PRICE_HOLD_RELEASE
    - MASS_PRICING_ERROR
    - CREDIT_BLOCK
    - INVOICE_QUERY
    - OTHER
  macro_f1_min: 0.90
  ece_max: 0.10
extraction:
  field_accuracy_min: 0.95
  # Hallucinated price/qty/SKU == a fabricated order line. Tight by design.
  hallucination_rate_max: 0.02
# ADR-045 §2.4 — spatial extraction. CONTAINMENT is the primary gate (not IoU);
# page accuracy is ZERO-tolerance (a wrong-page highlight is a trust-killer).
# Coordinate-hallucination is reported every run (the runtime verifier keeps it
# out of production). Confidence ECE guards uncalibrated confidence that gates
# whether a box shows. Lowering any of these is a deliberate, reviewed change.
extraction_spatial:
  containment_min: 0.95
  page_accuracy_min: 1.0
  hallucination_rate_max: 0.02
  ece_max: 0.15
