# Azure Key Vault CSI SecretProviderClass
# Injects secrets (SAP MCP credentials, Claude API key) from Azure Key Vault
# into the asoe-core pods as volume-mounted files.
#
# Prerequisites:
#   1. Azure Key Vault CSI driver installed in AKS cluster
#   2. Managed Identity or Workload Identity configured
#   3. Key Vault access policy granting GET on secrets
#
# Usage: Secrets are mounted to /mnt/secrets-store/ and optionally
#        synced as Kubernetes Secrets via secretObjects.

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: asoe-keyvault-secrets
  namespace: asoe
  labels:
    app.kubernetes.io/part-of: asoe
    compliance: "true"
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${AZURE_CLIENT_ID}"       # Workload Identity client ID
    keyvaultName: "${AZURE_KEYVAULT_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: sap-mcp-api-key
          objectType: secret
        - |
          objectName: claude-api-key
          objectType: secret
        - |
          objectName: langfuse-public-key
          objectType: secret
        - |
          objectName: langfuse-secret-key
          objectType: secret
  # Sync Key Vault secrets to Kubernetes Secret objects so they can be
  # referenced as env vars in deployment.yaml envFrom.
  secretObjects:
    - secretName: asoe-secrets
      type: Opaque
      data:
        - objectName: sap-mcp-api-key
          key: SAP_MCP_API_KEY
        - objectName: claude-api-key
          key: CLAUDE_API_KEY
        - objectName: langfuse-public-key
          key: LANGFUSE_PUBLIC_KEY
        - objectName: langfuse-secret-key
          key: LANGFUSE_SECRET_KEY
