apiVersion: v1
kind: Service
metadata:
  name: asoe-core
  namespace: asoe
  labels:
    app: asoe-core
spec:
  selector:
    app: asoe-core
  # ClusterIP only — external traffic enters via Azure APIM (architecture_v3.md §4)
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
