apiVersion: apps/v1
kind: Deployment
metadata:
  name: asoe-ui
  namespace: asoe
  labels:
    app: asoe-ui
    tier: ui
    app.kubernetes.io/part-of: asoe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asoe-ui
  template:
    metadata:
      labels:
        app: asoe-ui
        tier: ui
      annotations:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: asoe-ui-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ui
          image: your-acr.azurecr.io/asoe-ui:latest
          command:
            - streamlit
            - run
            - tests/sandbox/ui/app.py
            - --server.address=0.0.0.0
            - --server.port=8501
            - --server.headless=true
          env:
            - name: SANDBOX_DB_PATH
              value: "/app/tests/sandbox/sandbox.db"
            - name: USE_OUTLINES_BACKEND
              value: "0"
          envFrom:
            - configMapRef:
                name: asoe-core-config
          ports:
            - containerPort: 8501
              name: streamlit
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 25
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
