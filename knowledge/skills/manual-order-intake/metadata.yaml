# Knowledge bundle manifest for skill `manual-order-intake`.
#
# Channel-neutral cleanup per ADR-038 §3.2: the bundle was
# originally authored as `email-order-entry` (ADR-034 Phase A)
# when only the email channel was in scope. ADR-038 §3.2 binds
# the abstract semantic category to the channel-neutral name
# `manual-order-intake` (covers email + phone + fax). The bundle
# directory was renamed via `git mv` so SKILL.md history is
# preserved across the rename.

schema_version: 1
skill_name: manual-order-intake
bundle_version: 1.0.0
description: |
  Classifies a post-extraction email-channel sales-order envelope into
  one-click approve, standard review, low-confidence, or fatal-reject.
  Triggered on EMAIL_ORDER_ENTRY_REQUEST events.

# Recipe(s) this skill calls. Mirrors recipes/registry.py.
recipes:
  - EmailOrderEntryRecipe.py

# Intent enum value(s) this skill produces. Must be a subset of
# constraints/specs.py::AllowedIntent.
intents:
  - MANUAL_ORDER_INTAKE

# Event type strings (OrderEvent.event_type) routed to this skill by
# skills/loader.py::select_for_event.
event_types:
  - EMAIL_ORDER_ENTRY_REQUEST

# Anchor examples — loaded into the cached prefix on every call. Per
# ADR-038 §5.4 rule 1, keep ≤ 2 and change rarely. Bundle ships
# empty per ADR-038 §5.5 (examples are EARNED by real failures, not
# authored speculatively).
anchor_examples: []

# On-demand examples — agent loads via load_example tool. Manifest
# entries below are loaded as one-line summaries (NOT bodies) into
# the cached prefix.
on_demand_examples: []

# Server-rendered templates (ADR-038 §5.6). The agent provides field
# values; the harness fills the template body. Body never enters the
# agent's context.
assets: []

# Allowlist of runtime-included paths (ADR-038 §5.2). The L4 bundle
# loader hard-fails if a request reads a path not in this list. Specs
# under specs/ are deliberately excluded — humans navigate to them;
# the agent never sees them.
runtime_includes:
  - SKILL.md

# Cost guardrails enforced by the L4 harness during bundle load.
token_budget:
  cached_prefix_max_tokens: 3000
  on_demand_load_max_tokens: 4000
