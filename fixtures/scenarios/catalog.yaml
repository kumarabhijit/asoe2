# ASOE scenario catalog — single declarative source for the sandbox seed.
#
# Owned by asoe2 (RFC: asoe-ui/docs/synthetic-data-placement-rfc.md, Decision A).
# tests/sandbox/seed.py builds its 8 domain tables from this file; the
# coverage lock tests/sandbox/test_catalog_coverage.py asserts seed >= catalog.
# asoe-ui consumes a COMMITTED SNAPSHOT of this file (never reads it across
# repos at build time) to generate its mock layer.
#
# Provenance per scenario:
#   origin: baseline  -> migrated verbatim from the prior inline seed data.
#   origin: appendix  -> genuinely-new named-retailer / beverage scenarios
#                        reconciled from asoe-ui's 41-scenario appendix.
#
# GOVERNANCE (Guardrail #2 / #4): intent / lifecycle / shadow_verdict values
# MUST be members of contracts.models.Intent / LifecycleState / ShadowStatus
# (validated against /health). This file is NOT a second enum authority.
#
# Reconciliation note: appendix accounts (Walmart/Kroger/Target/Costco/SEBev)
# were ADDED as new retailer rows R-11..R-15 and appendix beverage SKUs were
# ADDED to sap_pricing (council decision: extend, do not remap) so no existing
# R-01..R-10 / SKU-001..010 baseline entity was mutated. Appendix scenarios
# that merely restated an intent already covered by a baseline EVT-* event
# were NOT duplicated; only new-shape clusters (multi-intent-per-PO) and the
# email MANUAL_ORDER_INTAKE scenarios were materialised.

