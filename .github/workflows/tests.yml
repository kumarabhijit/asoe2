# Python test suite — primary CI gate for asoe2.
#
# Runs the full pytest tests/ tree on every PR and on push to main.
# This single job covers what the codebase already structures as
# distinct tiers:
#
#   * Unit tests (tests/test_*.py): contracts, recipes, gateways,
#     skills, llm clients, executor, router, etc.
#   * Determinism / compliance tests: test_audit_chain,
#     test_audit_registry_coverage, test_v1_guardrails,
#     test_constraints, test_three_tier_hitl. CLAUDE.md §2 makes
#     these non-negotiable.
#   * Contract tests: test_openapi_contract, test_metadata_contract,
#     test_db_metadata_contract.
#   * Graph / topology tests: test_pipeline_topology,
#     test_graph_paths, test_executed_trace.
#   * Synthetic-fixture lint: test_synthetic_fixtures_shape (offline
#     guard for scripts/smoke-e2e.sh).
#   * Sandbox integration tier (tests/sandbox/): auth flow,
#     websocket events, db persistence, compliance simulation,
#     recipe integrity, and a multi-intent integration suite. All
#     drive the FastAPI app via TestClient — no Postgres/Redis
#     required.
#
# Heavy LLM extras (outlines / torch / transformers) are *not*
# installed: they are sandbox-runtime deps for constrained
# generation, not test deps. The dev extra in pyproject.toml is
# sufficient for the entire test tree.
#
# ASOE_ENV handling at CI time (post PARITY-0 Phase 0b):
# `tests/conftest.py` now pins ASOE_ENV=sandbox at conftest-import-time
# so the module-level `app = create_app()` in api/app.py uses the
# sandbox dispatch path during pytest collection (otherwise it would
# fail-loud, because production refuses to boot without real-connector
# wiring). The TTL constants in api/deps.py also resolve under sandbox
# (24h access / 30d refresh) — tests that assert specific TTLs read
# REFRESH_TOKEN_EXPIRE_SECONDS / ACCESS_TOKEN_EXPIRE_SECONDS
# dynamically rather than hardcoding a number, so this is safe.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest tests/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the version in .python-version (3.14.3).
          # The repo targets 3.14 because pydantic 2.12 + LangGraph
          # need the new typing API; do not downgrade without
          # updating Dockerfile.api / Dockerfile.core in lockstep.
          python-version-file: .python-version

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply pydantic 3.14 typing patch
        # Mirror Dockerfile.api: pydantic 2.12.5 still uses the
        # pre-3.14 typing._eval_type kwarg. The patch is a no-op
        # once pydantic >=2.12.6 ships.
        run: bash scripts/apply-patches.sh python

      - name: Run pytest
        run: pytest -q tests/

  # Phase H.7 — Postgres-backed path gate.
  #
  # The Postgres migration chain (apply_postgres) and the DB-backed
  # stores were NEVER exercised in CI before this job — only the SQLite
  # mirror ran. That masked a real chain bug (V009/V011 referenced a
  # non-existent `exception_record` table, aborting the chain on real
  # Postgres). This job spins up a Postgres service, runs the full
  # migration chain against it, and runs the DB-backed tests with
  # ASOE_TEST_POSTGRES_URL set so parity/durability suites execute on
  # real Postgres — not just SQLite.
  pytest-postgres:
    name: pytest (Postgres-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asoe
          POSTGRES_PASSWORD: asoe
          POSTGRES_DB: asoe_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job
        # steps run, so the migration step doesn't race the container.
        options: >-
          --health-cmd "pg_isready -U asoe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASOE_TEST_POSTGRES_URL: postgresql://asoe:asoe@localhost:5432/asoe_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install package + dev + postgres extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Apply pydantic 3.14 typing patch
        run: bash scripts/apply-patches.sh python

      - name: Validate the Postgres migration chain (apply_postgres)
        # Headline gate: a clean apply of V001→V0NN against real
        # Postgres. This step alone would have caught the
        # exception_record table-name bug. Run twice to assert
        # idempotency (every migration is version-guarded).
        run: |
          python -c "from db.migrations.runner import apply_postgres; apply_postgres('${ASOE_TEST_POSTGRES_URL}')"
          python -c "from db.migrations.runner import apply_postgres; apply_postgres('${ASOE_TEST_POSTGRES_URL}')"

      - name: Run DB-backed tests against Postgres
        # Parity / durability / repository suites read
        # ASOE_TEST_POSTGRES_URL and run against real Postgres when set,
        # falling back to SQLite tmp files locally. -k keeps the job
        # fast and focused on the storage layer.
        run: |
          pytest -q tests/ -k "postgres or parity or durability or repository or migration or order_case or case_store"

  # PARITY-0 Phase 0a — security CI gates (Security review).
  # Advisory (continue-on-error: true) for the first deploys so PARITY-0
  # isn't blocked on pre-existing CVEs / detected secrets. Promote to
  # required (`continue-on-error: false`) in a follow-up PR once the
  # baseline is clean.
  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[dev]"

      - name: Run pip-audit (isolated venv)
        # Audit our project in an ISOLATED venv. Auditing the runner's
        # shared env drags in system Python packages (dbus-python,
        # PyGObject, python-apt) that pip-audit can't resolve. Install
        # editable so `--skip-editable` correctly skips our own
        # `asoe` distribution. We drop `--strict` because it treats
        # editable-skip as a failure (conflicts with `--skip-editable`);
        # the default exit code still surfaces real CVE findings as
        # job failure → yellow X (continue-on-error: true above).
        run: |
          python -m venv /tmp/audit_venv
          /tmp/audit_venv/bin/python -m pip install --upgrade --quiet pip pip-audit
          /tmp/audit_venv/bin/python -m pip install --quiet -e ".[dev]"
          echo "--- audit set (excl. editable) ---"
          /tmp/audit_venv/bin/python -m pip freeze --exclude-editable \
            | grep -v -E '^(pip-audit)==' | wc -l
          echo "--- pip-audit findings ---"
          /tmp/audit_venv/bin/pip-audit --skip-editable

  gitleaks:
    name: gitleaks (committed secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pick up the repo's allowlist config — see .gitleaks.toml.
          # Promote `continue-on-error: false` above (job-level) when the
          # baseline is clean and the allowlist has been audited.
          GITLEAKS_CONFIG: .gitleaks.toml
