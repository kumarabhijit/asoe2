# Nightly SAP block-code reconciliation.
#
# Phase 6 of docs/plans/case-intent-supergroup-implementation-plan.md.
# Authority: docs/specs/case-intent-supergroup-requirements.md §3.9 + §8.8.
#
# Runs scripts/reconcile_sap_block_codes.py against the live SAP block-
# code snapshot and the current state of db/seeds/case_taxonomy.yaml.
# Opens a GitHub issue when drift is detected (new SAP code, stale DB
# row, or malformed seed row); a clean run writes nothing.
#
# The snapshot location is configured per-deployment via the
# SAP_BLOCK_SNAPSHOT_URL repository secret. When the secret is missing
# the job logs a one-line note and exits 0 — first-time deploys (and
# the asoe2 dev branch) don't have a real SAP feed yet, so a missing
# secret is not an error condition.
#
# Operator runbook: docs/runbooks/sap-block-reconciliation.md.

name: SAP Block-Code Reconciliation

on:
  schedule:
    # 02:00 UTC daily — quiet window across NA + EMEA business hours.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: "Override SAP_BLOCK_SNAPSHOT_URL for an ad-hoc run."
        required: false
        type: string

concurrency:
  group: sap-block-reconciliation
  cancel-in-progress: false  # serial — no parallel re-runs.

jobs:
  reconcile:
    name: reconcile SAP block codes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply pydantic 3.14 typing patch
        run: bash scripts/apply-patches.sh python

      - name: Resolve snapshot URL
        id: snapshot
        env:
          CONFIGURED_URL: ${{ secrets.SAP_BLOCK_SNAPSHOT_URL }}
          OVERRIDE_URL: ${{ inputs.snapshot_url }}
        run: |
          URL="${OVERRIDE_URL:-$CONFIGURED_URL}"
          if [ -z "$URL" ]; then
            echo "::notice::SAP_BLOCK_SNAPSHOT_URL not set — skipping reconciliation. Configure the secret to enable nightly drift detection."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch SAP snapshot
        if: steps.snapshot.outputs.skip == 'false'
        env:
          # Pass the URL through the env, NEVER interpolate a GHA
          # expression directly into a `run:` body. A workflow_dispatch
          # input containing shell metacharacters would otherwise be a
          # script-injection RCE primitive on the runner under the
          # job's GITHUB_TOKEN + secrets (review finding #1, BLOCKER).
          URL: ${{ steps.snapshot.outputs.url }}
        run: |
          # Validate the URL shape before curling — only https URLs
          # to allow-listable hosts. Belt-and-suspenders on top of
          # the env-var quoting.
          if ! printf '%s' "$URL" | grep -Eq '^https://[A-Za-z0-9._/?=&%-]+$'; then
            echo "::error::SAP snapshot URL is not a clean https URL: refusing to fetch."
            exit 1
          fi
          curl -fsSL "$URL" -o /tmp/sap_block_codes.csv
          # First line is the header — non-empty proves the fetch was
          # not just a 200 with empty body.
          head -1 /tmp/sap_block_codes.csv | grep -q "sap_block_code" || {
            echo "::error::SAP snapshot does not contain expected header columns."
            exit 1
          }

      - name: Apply migrations to scratch SQLite
        if: steps.snapshot.outputs.skip == 'false'
        run: |
          rm -f /tmp/recon.db
          DATABASE_URL=sqlite:////tmp/recon.db python -m db.migrations.runner

      - name: Run reconciliation
        if: steps.snapshot.outputs.skip == 'false'
        id: recon
        continue-on-error: true
        run: |
          set +e
          python -m scripts.reconcile_sap_block_codes \
              --sap-snapshot /tmp/sap_block_codes.csv \
              --database-url sqlite:////tmp/recon.db \
              --exit-nonzero-on-drift \
              | tee /tmp/recon.out
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Open / update steward issue on drift
        if: steps.snapshot.outputs.skip == 'false' && steps.recon.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/recon.out', 'utf8');
            const title = '[steward] SAP block-code drift detected';
            const body = [
              'The nightly reconciliation between the SAP block-code',
              'snapshot and `db/seeds/case_taxonomy.yaml` found drift.',
              '',
              'Steward SLA: map / deprecate within 1 business day.',
              'Runbook: `docs/runbooks/sap-block-reconciliation.md`.',
              '',
              '```',
              report,
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            // Find an existing open drift issue (idempotent — don't
            // open a new one every night for the same drift).
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'steward,reconciliation',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['steward', 'reconciliation'],
              });
            }

      - name: Open ops issue on script failure
        if: steps.snapshot.outputs.skip == 'false' && steps.recon.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '[ops] SAP reconciliation script failed',
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nReconciliation script exited 1 (operational failure, not drift). Investigate logs.`,
              labels: ['ops', 'reconciliation-broken'],
            });
