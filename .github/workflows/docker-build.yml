# Dockerfile buildability gate.
#
# asoe2 ships four images (api, core, inference, ui). A broken
# Dockerfile is invisible until deploy time without this gate.
# We build each image (no push) on PRs that touch the docker
# context — path-filtered so doc-only / fixture-only PRs don't
# burn ~5 min of CI per image.
#
# We do NOT run the resulting images: asoe-ui's browser-e2e
# workflow already drives uvicorn against the asoe2 source tree
# (sibling checkout) for behavioural coverage. This job only
# proves the image *builds*.
name: Docker Build

on:
  pull_request:
    paths:
      - 'Dockerfile.*'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/apply-patches.sh'
      - 'scripts/sandbox-entrypoint.sh'
      - 'api/**'
      - 'contracts/**'
      - 'constraints/**'
      - 'compliance/**'
      - 'recipes/**'
      - 'skills/**'
      - 'gateways/**'
      - 'workflows/**'
      - 'orchestration/**'
      - 'observability/**'
      - 'hardening/**'
      - 'llm/**'
      - 'prompts/**'
      - 'db/**'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `continue-on-error` per matrix entry — set on inference because
    # Dockerfile.inference pins torch>=2.3.0+cpu / outlines>=0.0.46 /
    # transformers>=4.41.0 against a Python 3.14 base. Those pins
    # predate any 3.14 wheels in the ML ecosystem (torch 2.5 / outlines
    # 1.x / transformers 4.50+ are the first 3.14-compatible
    # generations), so `uv pip install` currently falls back to a
    # source build and OOMs / fails. That is a Dockerfile-drift
    # problem, not a CI problem, and is tracked separately. Surface
    # the failure (yellow X in the matrix) but don't block the gate
    # on it until the inference image is repinned.
    continue-on-error: ${{ matrix.image == 'inference' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
          - image: core
            dockerfile: Dockerfile.core
          - image: inference
            dockerfile: Dockerfile.inference
          - image: ui
            dockerfile: Dockerfile.ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          # PARITY-0 Phase 0a (Azure/SRE review): load the api/core images
          # into the local Docker daemon so trivy can scan them. We skip
          # inference (continue-on-error matrix entry; image doesn't build
          # cleanly yet) and ui (built in the asoe-ui repo).
          load: ${{ matrix.image == 'api' || matrix.image == 'core' }}
          tags: asoe-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # PARITY-0 Phase 0a security gate: image vulnerability scan
      # (Security + Azure/SRE review). Trivy fails on CRITICAL/HIGH CVEs
      # in OS packages + application deps. Advisory for now
      # (continue-on-error) — promote to required once the baseline is
      # clean.
      - name: Run Trivy image scan
        if: matrix.image == 'api' || matrix.image == 'core'
        continue-on-error: true
        # Pinned action tag (Review 2 finding) — floating @master would
        # let a Trivy behaviour change land mid-run unannounced.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: asoe-${{ matrix.image }}:ci
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      # PARITY-0 Phase 0a acceptance #5: non-root container verified at
      # CI time. Run the image and assert the default user isn't root.
      # Strict (no continue-on-error) — the Dockerfile.api / .core both
      # already create + switch to a non-root user, so this must hold.
      - name: Verify image runs as non-root
        if: matrix.image == 'api' || matrix.image == 'core'
        run: |
          USER_NAME=$(docker run --rm --entrypoint sh asoe-${{ matrix.image }}:ci -c whoami)
          USER_UID=$(docker run --rm --entrypoint sh asoe-${{ matrix.image }}:ci -c 'id -u')
          echo "Image runs as user=${USER_NAME} uid=${USER_UID}"
          if [ "${USER_NAME}" = "root" ] || [ "${USER_UID}" = "0" ]; then
            echo "::error::Container runs as root — fix Dockerfile.${{ matrix.image }} to USER non-root"
            exit 1
          fi
