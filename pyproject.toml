[project]
name = "asoe"
version = "0.3.2"
description = "Starter scaffold for a deterministic skill-shadow-recipe pricing exception system with constrained generation"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.7.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
outlines = [
  "outlines>=1.2.12",
  "transformers>=4.48.0",
  "torch>=2.3.0",
]
postgres = [
  "psycopg2-binary>=2.9.0",
]
langfuse = [
  "langfuse>=2.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "contracts",
  "constraints",
  "compliance",
  "recipes",
  "skills",
  "gateways",
  "workflows",
  "orchestration",
  "observability",
  "hardening",
  "llm",
  "prompts",
  "api",
  "db",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

