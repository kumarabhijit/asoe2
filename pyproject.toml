[project]
name = "asoe"
version = "0.3.2"
description = "Starter scaffold for a deterministic skill-shadow-recipe pricing exception system with constrained generation"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.7.0",
  # Cap below 0.136.3 — that release was flagged by PyPI advisory
  # MAL-2026-4750 (Amazon Inspector) for adding an undocumented
  # `fastar>=0.9.0` typosquat-style dep to its [standard] extra. We pin
  # bare fastapi (no [standard] extra) so the dep wouldn't activate, but
  # the 0.136.3 wheel/sdist itself was modified — safer to avoid the
  # tampered release entirely. Lift the upper bound once a clean
  # fastapi>=0.136.3 ships and the advisory is withdrawn.
  "fastapi>=0.110.0,<0.136.3",
  "uvicorn[standard]>=0.29.0",
  "redis>=5.0.0",
  # Compliance: audit-bearing field registry
  # (compliance/audit_bearing_registry.yaml) is parsed at import time
  # by api/analysis_composer.py. PyYAML is transitively available via
  # langchain today but pinned explicitly here so the registry load
  # isn't at the mercy of an unrelated dep change.
  "pyyaml>=6.0",
  # JSON-schema validation of the case taxonomy seed
  # (db/seeds/case_taxonomy.yaml). Loader (scripts/seed_taxonomy.py)
  # validates at import time; without this, a malformed seed reaches
  # the DB silently. Required (not optional) per code-review finding #9.
  "jsonschema>=4.17.0",
]

[project.optional-dependencies]
outlines = [
  "outlines>=1.2.12",
  "transformers>=4.48.0",
  "torch>=2.3.0",
]
postgres = [
  "psycopg2-binary>=2.9.0",
]
langfuse = [
  "langfuse>=2.0.0",
]
anthropic = [
  # Required when ASOE_LLM_PROVIDER ∈ {anthropic, azure_anthropic}.
  # SDK is lazy-imported in llm/anthropic_client.py so the core
  # service runs without it when the deterministic backend is active.
  "anthropic>=0.40.0",
]
openai = [
  # Required when ASOE_LLM_PROVIDER=openai. Covers OpenAI direct,
  # Azure OpenAI, and OpenAI-compatible self-hosted clusters
  # (vLLM, TGI, LiteLLM, LocalAI). SDK is lazy-imported in
  # llm/openai_client.py.
  "openai>=1.50.0",
]
ollama = [
  # Required when ASOE_LLM_PROVIDER=ollama. SDK is lazy-imported in
  # llm/ollama_client.py. Ollama 0.4+ supports tool calling via the
  # native chat API.
  "ollama>=0.4.0",
]
huggingface = [
  # Required when ASOE_LLM_PROVIDER=huggingface (HF Inference
  # Endpoints / Inference API). SDK is lazy-imported in
  # llm/huggingface_client.py. 0.27+ supports OpenAI-style tool
  # calling on Qwen / Llama 3.1+ / Mistral Large 2 endpoints.
  "huggingface_hub>=0.27.0",
]
azure = [
  # PARITY-2: Azure Blob Storage driver for the attachment object store
  # (gateways/attachment_store.py::_azure_blob_store). Lazy-imported so
  # the core service runs without these installed; managed identity via
  # DefaultAzureCredential picks up the Container App's identity in
  # production.
  "azure-storage-blob>=12.19.0",
  "azure-identity>=1.16.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  # Property-based testing (design.md Lane 1 W4 — item 20 from the
  # pending tasks list). The existing test_recipe_invariants.py
  # uses a deterministic stdlib random.Random; hypothesis adds
  # shrinking on failure + arbitrary strategies. The migration is
  # incremental — new tests adopt hypothesis; the stdlib fuzzer
  # remains until each is ported.
  "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "contracts",
  "constraints",
  "compliance",
  "recipes",
  "skills",
  "gateways",
  "workflows",
  "orchestration",
  "observability",
  "hardening",
  "llm",
  "prompts",
  "api",
  "db",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "replay: eval-harness run against frozen recorded gateway outputs (PR gate; no live model)",
    "live: eval-harness run against a live model (nightly only; never gates red-green)",
]

