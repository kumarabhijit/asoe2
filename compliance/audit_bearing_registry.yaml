# ---------------------------------------------------------------------------
# Grandfather clauses — audit-bearing fields without a current producer.
# The composition node treats these fields as contextual until the
# deadline; after the deadline, missing values route the exception to
# AUDIT_CONTEXT_MISSING.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# LLM Provenance — V1 PR-1 (pending compliance sign-off).
# ---------------------------------------------------------------------------
# Audit-bearing fields recorded on every TraceRecord.llm_calls entry
# when a remote LLM (Anthropic / OpenAI / Azure OpenAI / Ollama /
# HuggingFace / vLLM) served a trio call. Empty list when the run was
# served by the deterministic fallback (default / kill-switch /
# explain-mode / fallback paths).
#
# Workshop status: PENDING. The remote-LLM tier was not in scope at
# the 2026-04-22 compliance workshop — it was the V2 design blueprint
# (architecture_v3.md §7.I). Sign-off on these classifications must
# happen before any production deploy that flips ASOE_LLM_PROVIDER
# off `fallback`. The `pending_signoff: true` marker is honored by
# CODEOWNERS gates (path rule pending) so a compliance reviewer is
# requested on every PR that touches this section.
#
# Source: control. These three fields name the provider, the resolved
# model, and the provider request id — sufficient for an auditor to
# reconstruct WHICH model produced WHICH decision and to file a
# support ticket with the provider on disputed runs (Marcus Chen
# review §4: "request_id is critical for support tickets").
EntitiesAnalysisData:
  # ADR-042 Phase 2 — Customer Inbox Entities tab. Extracted entities are
  # contextual evidence the operator reviews; the binding control fields
  # remain recommended_action / autonomy_level.
  extracted:
    tier: contextual
    source: gateway
    rationale: >-
      Entities the AI intake agent extracted from the email / attachments,
      surfaced to the operator as evidence (each with an optional
      source_span for provenance). Not itself a binding control field.

SapDataAnalysisData:
  # ADR-042 Phase 2 — Customer Inbox SAP Data tab. The SAP system of record,
  # its validation state, and the order value are what the operator authorises
  # against; the doc number is a contextual reference.
  system:
    tier: audit-bearing
    source: gateway
    rationale: >-
      SAP system of record (e.g. S4H_PRD / ECC_PRD) the decision applies to.
      §404 — authorization is scoped to a specific system's order.
  validation_status:
    tier: audit-bearing
    source: gateway
    rationale: >-
      Live SAP validation state (e.g. "SO confirmed, ATP OK") the operator
      acts on; a different state changes the authorization.
  order_value_usd:
    tier: audit-bearing
    source: gateway
    rationale: >-
      Order / financial value from SAP — drives the four-eyes threshold and
      the operator's risk assessment.
  sap_doc_number:
    tier: contextual
    source: gateway
    rationale: >-
      SAP document reference (FI/SD doc) for traceability; contextual, not a
      binding control field.

LLMProvenance:
  llm_provider_used:
    tier: audit-bearing
    source: control
    pending_signoff: true
    rationale: >-
      Identifies which LLM provider (anthropic / openai /
      azure_anthropic / google / ollama / huggingface /
      fallback) actually served the trio call. Required for
      SOX evidence reconstruction — the auditor must know
      whether a financial decision came from a frontier
      cloud model, a private vLLM cluster, an in-tenant
      Foundry endpoint, or the deterministic safety net.
      Populated from RemoteLLMBackend.last_call_trace via
      orchestration._drain_llm_trace (see
      observability/tracer.py llm_calls aggregation).

  llm_model_id:
    tier: audit-bearing
    source: control
    pending_signoff: true
    rationale: >-
      Resolved model id reported BY the provider response.
      Distinct from the configured alias because providers
      may rewrite (Anthropic adds a date suffix; Azure OpenAI
      maps deployment_name → underlying model). The auditor
      relies on the resolved value to reproduce a decision.
      Mismatched aliases between trace and config are a known
      drift signal.

  llm_request_id:
    tier: audit-bearing
    source: control
    pending_signoff: true
    rationale: >-
      Provider-issued request identifier (Anthropic
      'request-id' header; OpenAI 'x-request-id' header; HF
      Inference completion id). Required for support tickets
      with the provider on disputed runs and for the
      cross-system audit chain that links our TraceRecord to
      the provider's own server-side log.

EntityProfile:
  customer_name:
    tier: audit-bearing
    source: master-data
    rationale: >-
      The customer-of-record on the resolution. Operators authorise
      financially-binding action against this name; downstream SOX
      attestation references it in the four-eyes audit row.
  bp_number:
    tier: audit-bearing
    source: master-data
    rationale: >-
      SAP Business Partner number — the deterministic identifier
      that ties UI display back to the SAP master record. Required
      for cross-system reconciliation.
  customer_tier:
    tier: contextual
    source: master-data
    rationale: >-
      Account tier (enterprise / strategic / standard). Influences
      visual treatment on the operator surface but is not itself
      a deterministic gate on any policy decision.
  vip_status:
    tier: contextual
    source: backend-gap
    rationale: >-
      Operator-facing VIP indicator. No producer wired today; tracked
      under EntityProfile grandfather clause. Reclassify to
      audit-bearing once a customer-master gateway lands and
      compliance signs off on a deadline.
  credit_standing:
    tier: contextual
    source: backend-gap
    rationale: >-
      Credit standing display string. No producer wired today;
      tracked under EntityProfile grandfather clause.
  location:
    tier: contextual
    source: master-data
    rationale: >-
      Free-text location label (city / DC). Decorative on the
      operator surface; absence is acceptable.
  region:
    tier: contextual
    source: master-data
    rationale: >-
      Account region (e.g., National / Midwest / West). Sourced
      from the seed Account row; absence is acceptable.

ImpactMetrics:
  revenue_at_risk:
    tier: audit-bearing
    source: derived
    rationale: >-
      Quantitative blast radius the operator weighs when authorising
      an action. Computed deterministically from line-item totals;
      MUST be present whenever line items are.
  delta_amount:
    tier: audit-bearing
    source: derived
    rationale: >-
      Signed PO-vs-ERP variance in dollars. Together with
      delta_percentage these are the two numbers the four-eyes
      threshold gate (POLICY_FOUR_EYES_THRESHOLD) reads against.
  delta_percentage:
    tier: audit-bearing
    source: derived
    rationale: >-
      PO-vs-ERP variance as a percentage of ERP price. Used in
      conjunction with delta_amount.
  fulfillment_gap_pct:
    tier: contextual
    source: derived
    rationale: >-
      Optional fulfilment gap as a percentage. Present only when
      line items carry fulfilled_quantity; absence is structural,
      not a partial-truth.
  sla_priority:
    tier: audit-bearing
    source: derived
    rationale: >-
      Coarse SLA priority label (P1-P4). Presentation mapping over
      shadow_verdict + lifecycle; the deterministic source values
      are themselves audit-bearing, so the projection inherits.
  sla_deadline:
    tier: contextual
    source: backend-gap
    rationale: >-
      Wall-clock SLA deadline. No producer wired today; tracked
      under ImpactMetrics grandfather clause. Reclassify once a
      contract-SLA gateway populates the deadline.
  affected_lines:
    tier: audit-bearing
    source: derived
    rationale: >-
      Number of line items in scope of the resolution. Drives the
      operator's review checklist; trivially derived from the
      line-items list, MUST agree with it.

# ---------------------------------------------------------------------------
# DuplicatePOEnvelope (ADR-028 G2 / action item A6) — V1 PR-B.
# ---------------------------------------------------------------------------
# Single-round-trip canonical envelope returned by
# GET /api/v1/exceptions/duplicates/{id}. Composer:
# api/duplicate_envelope.py::compose_duplicate_po_envelope.
#
# This section sits OUTSIDE the *AnalysisData family — the envelope is
# a separate flat shape composed FROM existing AnalysisData fields
# (DuplicateDetectionData / OrderComparisonData), not a replacement for
# them. The tests/test_audit_registry_coverage.py fitness test for
# *AnalysisData classes does not auto-check this section; the summary
# tally below DOES count every row here.
#
# Source attributions:
#   * shadow-policy / recipe-output / control / derived — same vocab
#     as the *AnalysisData family.
#   * envelope-projection — new tag for fields that PROJECT data
#     already classified elsewhere (e.g. matched_po projects from
#     DuplicateDetectionData.original_order). The classification
#     tier matches the source; envelope-projection is the
#     traceability marker, not a standalone classification.
DuplicatePOEnvelope:
  exception_id:
    tier: audit-bearing
    source: control
    rationale: >-
      Record identity. Every audit-trail entry, every human-action
      entry, and every downstream cross-reference cites this id;
      its presence on the envelope is non-negotiable.
  tenant_id:
    tier: audit-bearing
    source: control
    rationale: >-
      Tenant scope. SOX requires the auditor to see WHO the action
      applied to; tenant_id is the deterministic answer.
  intent:
    tier: audit-bearing
    source: shadow-policy
    rationale: >-
      Always "DUPLICATE_PO" on this envelope (Literal). Audit-bearing
      because the envelope endpoint refuses to serve when intent
      doesn't match — the value is the gate the route handler asserts
      against.
  lifecycle_state:
    tier: audit-bearing
    source: control
    rationale: >-
      State the operator is acting on (PENDING_REVIEW vs RESOLVED vs
      BLOCKED, etc.). Authorisation depends on lifecycle position.
  shadow_verdict:
    tier: audit-bearing
    source: shadow-policy
    rationale: >-
      Compliance Shadow's GREEN/YELLOW/RED — the verdict the
      authorisation must align with. Optional only because
      pre-shadow records have no value yet; post-shadow it MUST be
      populated.
  final_status:
    tier: audit-bearing
    source: control
    rationale: >-
      TerminalStatus of the run (COMPLETE / MANUAL_REVIEW_REQUIRED /
      BLOCKED / FAIL_TO_HUMAN / AUDIT_CONTEXT_MISSING). Auditors cite
      this when reconstructing why the record is in its current
      lifecycle.
  incoming_po:
    tier: audit-bearing
    source: control
    rationale: >-
      The PO under review. Reviewer authorises action against this
      snapshot; absence is a partial-truth.
    subfields:
      so_number: audit-bearing      # surrogate (exception_id when SAP SO not yet assigned)
      po_number: audit-bearing
      created_date: audit-bearing
      total_value: audit-bearing
      line_count: audit-bearing
      status: audit-bearing
  matched_po:
    tier: conditional
    depends_on: resolved_action in [BLOCK_AND_NOTIFY, MERGE, SUPERSEDE, ALLOW_BOTH, ESCALATE, REQUEST_BUYER_CONFIRMATION]
    source: control
    rationale: >-
      The matched existing PO from the OMS gateway. Audit-bearing
      whenever the operator is authorising a resolution that
      compares against an existing PO (every duplicate-PO action
      does). Optional at the type level so early-halt records
      (BLOCKED by shadow with no gateway call) don't false-positive
      AUDIT_CONTEXT_MISSING. Projects from
      DuplicateDetectionData.original_order — same audit-bearing
      classifications inherit; this row is the envelope-projection
      marker.
    subfields:
      so_number: audit-bearing
      po_number: audit-bearing
      created_date: audit-bearing
      total_value: audit-bearing
      line_count: audit-bearing
      status: audit-bearing
  signal_breakdown:
    tier: audit-bearing
    source: recipe-output
    rationale: >-
      Per-signal weighted contribution to composite_score. Auditor
      sees WHY the score was what it was; the operator authorising
      BLOCK_AND_NOTIFY cites the signals that drove the score.
  composite_score:
    tier: audit-bearing
    source: recipe-output
    rationale: >-
      Single-number summary the analyst signs off on; threshold
      comparisons (auto_block / review_required / soft_flag) are
      computed against this.
  classification:
    tier: audit-bearing
    source: recipe-output
    rationale: >-
      Decision-tier label (AUTO_BLOCK / REVIEW_REQUIRED / SOFT_FLAG /
      PASS) — also in always_audit_bearing_field_names.
  recommended_action:
    tier: audit-bearing
    source: recipe-output
    rationale: >-
      The proposed disposition the operator approves or overrides —
      also in always_audit_bearing_field_names.
  autonomy_level:
    tier: audit-bearing
    source: control
    rationale: >-
      Names the L1/L2/L3/L4 control tier — explains why the action
      did or did not auto-execute. §404 cites L-tiers explicitly.
      Optional only because pre-recipe halts leave it None.
  agent_reasoning:
    tier: contextual
    source: derived
    rationale: >-
      Human-readable narrative projected from trace.explanation.
      Regenerable from policy_hits + lifecycle; absence is fine.
      The auditable substance is in shadow_verdict + classification +
      recommended_action.
  config_layer_trace:
    tier: audit-bearing
    source: control
    rationale: >-
      ADR-029 per-layer contribution trace — operator + auditor
      see WHICH of the 5 config layers (platform → tenant → tier →
      customer → channel) supplied each final weight value. Without
      this, a reviewer can't reconstruct which tenant configuration
      drove the score. Optional only because non-orchestration
      paths (tests bypassing the gateway) may not produce one.
    subfields:
      signal: audit-bearing
      value: audit-bearing
      source_layer: audit-bearing
  audit_trail:
    tier: audit-bearing
    source: control
    rationale: >-
      Chronological policy_audit_log entries filtered to events
      that reference this exception. event_hash carries SOX chain
      integrity — auditors can verify without re-querying the log
      table. Filter convention documented in
      api/duplicate_envelope.py::_entry_relates_to_exception.
    subfields:
      event_type: audit-bearing
      timestamp: audit-bearing
      actor: audit-bearing
      payload: audit-bearing
      event_hash: audit-bearing
  human_actions:
    tier: audit-bearing
    source: control
    rationale: >-
      Synthesised chronological list of HITL actions (APPROVE /
      OVERRIDE / ESCALATE / COSIGN_*). Reviewer cites prior actions
      when authorising a follow-up disposition. Distinct from
      audit_trail (SOX log rows) — human_actions is the
      domain-language summary the operator reads.
    subfields:
      action: audit-bearing
      actor: audit-bearing
      timestamp: audit-bearing
      notes: contextual         # free-text narrative; regenerable
      reason_tag: audit-bearing # ADR-033 structured reason code
      payload: contextual       # action-specific extras
  created_at:
    tier: audit-bearing
    source: control
    rationale: Record-of-action timestamp — SOX trail anchor.
  updated_at:
    tier: audit-bearing
    source: control
    rationale: State-of-record timestamp.

grandfather_clauses:
  # entity_profile_master_gap (added 2026-05-02): customer_tier ships
  # from the seed Account table today, but vip_status, credit_standing,
  # and location have no producer. The fields stay declared so the UI
  # can render them once a customer-master gateway lands.
  # Deadline: 2026-08-01 (re-evaluate at next compliance workshop).

  # impact_metrics_sla_gap (added 2026-05-02): sla_deadline is
  # declared but unpopulated until the contract-SLA gateway lands.
  # Deadline: 2026-08-01.

  # price_analysis_gateway_gap retired (T4, 2026-04-22): SAP doc /
  # contract / promotion gateways are wired on
  # PriceAdjustmentRecipe; doc_type / doc_number / rule_id /
  # root_cause_category persist as audit-bearing via
  # enrichment_context. contract_ref / promotion_ref reclassified to
  # contextual (conditionally present — not every price line is
  # contract- or promotion-governed).

  # moq_gateway_gap retired (T5, 2026-04-22): SAP customer_master +
  # sap_contract + sap_block gateways wired on MOQRoundUpRecipe;
  # moq_source / channel / contract_ref / block_status persist via
  # enrichment_context.

  # overmax_gateway_gap retired (T5, 2026-04-22): SAP contract +
  # sap_block gateways wired on OverMaxTrimRecipe; contract_ref /
  # block_status / block_reason persist via enrichment_context.
  # order_lines / trim_plan / uom were misclassified under this clause
  # (recipe-driven, not gateway-driven) — they remain audit-bearing
  # and project from event metadata + recipe output.

  # delivery_delay_financial_gap retired (T5, 2026-04-22): SLA contract
  # gateway wired on DeliveryDelayResolutionRecipe; at_risk +
  # sla_deadline persist via enrichment_context.

  # email_intake_gateway_stub_only (added 2026-05-04, ADR-034 Phase B):
  # the four `email_intake` gateway operations (sender_auth,
  # resolve_customer, duplicate_po_pre_check, credit_check) ship as
  # StubGateway responses in V1. Real upstream connectors —
  # Microsoft Graph / customer-master / OMS duplicate pre-check / credit
  # service — are a separate platform track tracked under Phase D
  # (proposed ADR-035, MCP tool surface). The four floor_status
  # booleans are audit-bearing as written; the StubGateway responses
  # supply deterministic, defensible default evidence for V1.
  # Deadline: 2026-08-04 (90-day re-evaluation at the next compliance
  # workshop) — drop the clause when the real connectors land.

