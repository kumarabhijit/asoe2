DeliveryDelayAnalysisData:
  planned_date:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [DELIVERY_DELAY_PENDING_COMPUTE, DELIVERY_DELAY_SEVERE, DELIVERY_DELAY_MINOR_REVIEW, DELIVERY_DELAY_ON_TIME]
  projected_eta:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [DELIVERY_DELAY_PENDING_COMPUTE, DELIVERY_DELAY_SEVERE, DELIVERY_DELAY_MINOR_REVIEW, DELIVERY_DELAY_ON_TIME]
  days_late:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [DELIVERY_DELAY_SEVERE, DELIVERY_DELAY_MINOR_REVIEW]
    derivation: (projected_eta - planned_date).days
  delay_category:
    tier: audit-bearing
    source: recipe-input
    rationale: Category (CARRIER_DELAY / PRODUCTION_DELAY / LOGISTICS / WEATHER / CUSTOMS) is audit-citable; reason text is not.
  affected_lines:
    tier: audit-bearing
    source: control
    rationale: Touches per-line delay × line value → financial impact.
  at_risk:
    tier: audit-bearing
    source: control
    rationale: four-eyes trigger (SLA penalties + downstream).
  sla_deadline:
    tier: audit-bearing
    source: control
    rationale: SLA posture being committed to by EXPEDITE / RESCHEDULE choice (when contractually defined).
    note: Optional at the type level; when the gateway produces it, it is audit-bearing.
  alternate_options:
    tier: conditional
    # Recipe (DeliveryDelayResolutionRecipe) emits options with
    # type in {EXPEDITE, SPLIT_SHIP, PARTIAL, RESCHEDULE}. The
    # composer's _predicate_holds supports static membership;
    # keep the list aligned with the recipe's AlternateOption
    # vocabulary.
    depends_on: resolved_action in [EXPEDITE, SPLIT_SHIP, PARTIAL, RESCHEDULE]
    source: recipe-output
    rationale: Required when the approved action selects from this list.
  delay_reason:
    tier: contextual
    source: decorative
    rationale: Free text; supports but does not drive the decision.
  carrier:
    tier: contextual
    source: decorative
  route:
    tier: contextual
    source: decorative
  rule_id:
    tier: contextual
    source: decorative
    rationale: Prototype rule band provenance; not audit-citable on its own.

