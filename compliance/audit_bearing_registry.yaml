    source: recipe-output
    rationale: Drives SoD routing (HARD_REJECT → RED, REVIEW → YELLOW, ESCALATE → manager+).
  recommended_action:
    tier: audit-bearing
    source: recipe-output
    rationale: Authorization vocabulary; ties to AllowedResolutionAction.
  autonomy_level:
    tier: audit-bearing
    source: control
    rationale: Names the L1/L2/L3 control tier — §404 cites these explicitly.
  expected_value:
    tier: audit-bearing
    source: control
    rationale: Decision substrate — reviewer cannot inspect the mismatch without it.
  received_value:
    tier: audit-bearing
    source: control
    rationale: Decision substrate — pair with expected_value.
  notification_template:
    tier: contextual
    source: decorative
    rationale: Downstream email plumbing; zero audit content.

BackOrderAnalysisData:
  ordered_qty:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [BACK_ORDER_MISSING_INPUT, BACK_ORDER_SEVERE_GAP, BACK_ORDER_MINOR_GAP_REVIEW]
  available_qty:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [BACK_ORDER_MISSING_INPUT, BACK_ORDER_SEVERE_GAP, BACK_ORDER_MINOR_GAP_REVIEW]
  gap_qty:
    tier: audit-bearing
    source: recipe-output
    derivation: ordered_qty - available_qty
  gap_pct:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [BACK_ORDER_SEVERE_GAP, BACK_ORDER_MINOR_GAP_REVIEW]
    derivation: (ordered_qty - available_qty) / ordered_qty
  unit_price:
    tier: audit-bearing
    source: control
    rationale: Feeds at_risk; at_risk feeds four-eyes threshold per policy.py §102.
  uom:
    tier: audit-bearing
    source: control
    rationale: Quantity interpretation.
  at_risk:
    tier: audit-bearing
    source: control
    rationale: financial_impact_usd for four-eyes cosign trigger.
    derivation: gap_qty * unit_price
  atp_date:
    tier: audit-bearing
    source: control
    rationale: Customer-commitment substrate on SPLIT_SHIPMENT / RESCHEDULE approvals.
  resolution_options:
    tier: audit-bearing
    source: recipe-output
    rationale: The ranked recommendation being accepted or overridden.
  primary_dc:
    tier: audit-bearing
    source: control
    rationale: Reviewer must see which DC was queried before approving ALT_DC or SUBSTITUTE.
    gateway_dependency: true
  alternate_warehouses:
    tier: conditional
    depends_on: resolved_action == ALT_DC
    source: control
    gateway_dependency: true
    rationale: Required when the approved action is ALT_DC routing.
  substitutes:
    tier: conditional
    depends_on: resolved_action == SUBSTITUTE
    source: control
    gateway_dependency: true
    rationale: Required when the approved action substitutes SKUs.
  production:
    tier: conditional
    depends_on: resolved_action == RESCHEDULE
    source: control
    gateway_dependency: true
  inbound_po:
    tier: conditional
    depends_on: resolved_action == RESCHEDULE
    source: control
    gateway_dependency: true

