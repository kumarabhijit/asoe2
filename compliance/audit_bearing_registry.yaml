    source: recipe-output
    derivation: total_ordered - max_qty
  exceedance_pct:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [OVER_MAX_SEVERE_EXCEEDANCE, OVER_MAX_MINOR_REVIEW]
  uom:
    tier: audit-bearing
    source: control
  at_risk:
    tier: audit-bearing
    source: control
    rationale: four-eyes trigger.
  contract_ref:
