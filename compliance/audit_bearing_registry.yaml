# ---------------------------------------------------------------------------
# Grandfather clauses — audit-bearing fields without a current producer.
# The composition node treats these fields as contextual until the
# deadline; after the deadline, missing values route the exception to
# AUDIT_CONTEXT_MISSING.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# LLM Provenance — V1 PR-1 (pending compliance sign-off).
# ---------------------------------------------------------------------------
# Audit-bearing fields recorded on every TraceRecord.llm_calls entry
# when a remote LLM (Anthropic / OpenAI / Azure OpenAI / Ollama /
# HuggingFace / vLLM) served a trio call. Empty list when the run was
# served by the deterministic fallback (default / kill-switch /
# explain-mode / fallback paths).
#
# Workshop status: PENDING. The remote-LLM tier was not in scope at
# the 2026-04-22 compliance workshop — it was the V2 design blueprint
# (architecture_v3.md §7.I). Sign-off on these classifications must
# happen before any production deploy that flips ASOE_LLM_PROVIDER
# off `fallback`. The `pending_signoff: true` marker is honored by
# CODEOWNERS gates (path rule pending) so a compliance reviewer is
# requested on every PR that touches this section.
#
# Source: control. These three fields name the provider, the resolved
# model, and the provider request id — sufficient for an auditor to
# reconstruct WHICH model produced WHICH decision and to file a
# support ticket with the provider on disputed runs (Marcus Chen
# review §4: "request_id is critical for support tickets").
LLMProvenance:
  llm_provider_used:
    tier: audit-bearing
    source: control
    pending_signoff: true
    rationale: >-
      Identifies which LLM provider (anthropic / openai /
      azure_anthropic / google / ollama / huggingface /
      fallback) actually served the trio call. Required for
      SOX evidence reconstruction — the auditor must know
      whether a financial decision came from a frontier
      cloud model, a private vLLM cluster, an in-tenant
      Foundry endpoint, or the deterministic safety net.
      Populated from RemoteLLMBackend.last_call_trace via
      orchestration._drain_llm_trace (see
      observability/tracer.py llm_calls aggregation).

  llm_model_id:
    tier: audit-bearing
    source: control
    pending_signoff: true
    rationale: >-
      Resolved model id reported BY the provider response.
      Distinct from the configured alias because providers
      may rewrite (Anthropic adds a date suffix; Azure OpenAI
      maps deployment_name → underlying model). The auditor
      relies on the resolved value to reproduce a decision.
      Mismatched aliases between trace and config are a known
      drift signal.

  llm_request_id:
    tier: audit-bearing
    source: control
    pending_signoff: true
    rationale: >-
      Provider-issued request identifier (Anthropic
      'request-id' header; OpenAI 'x-request-id' header; HF
      Inference completion id). Required for support tickets
      with the provider on disputed runs and for the
      cross-system audit chain that links our TraceRecord to
      the provider's own server-side log.

EntityProfile:
  customer_name:
    tier: audit-bearing
    source: master-data
    rationale: >-
      The customer-of-record on the resolution. Operators authorise
      financially-binding action against this name; downstream SOX
      attestation references it in the four-eyes audit row.
  bp_number:
    tier: audit-bearing
    source: master-data
    rationale: >-
      SAP Business Partner number — the deterministic identifier
      that ties UI display back to the SAP master record. Required
      for cross-system reconciliation.
  customer_tier:
    tier: contextual
    source: master-data
    rationale: >-
      Account tier (enterprise / strategic / standard). Influences
      visual treatment on the operator surface but is not itself
      a deterministic gate on any policy decision.
  vip_status:
    tier: contextual
    source: backend-gap
    rationale: >-
      Operator-facing VIP indicator. No producer wired today; tracked
      under EntityProfile grandfather clause. Reclassify to
      audit-bearing once a customer-master gateway lands and
      compliance signs off on a deadline.
  credit_standing:
    tier: contextual
    source: backend-gap
    rationale: >-
      Credit standing display string. No producer wired today;
      tracked under EntityProfile grandfather clause.
  location:
    tier: contextual
    source: master-data
    rationale: >-
      Free-text location label (city / DC). Decorative on the
      operator surface; absence is acceptable.
  region:
    tier: contextual
    source: master-data
    rationale: >-
      Account region (e.g., National / Midwest / West). Sourced
      from the seed Account row; absence is acceptable.

ImpactMetrics:
  revenue_at_risk:
    tier: audit-bearing
    source: derived
    rationale: >-
      Quantitative blast radius the operator weighs when authorising
      an action. Computed deterministically from line-item totals;
      MUST be present whenever line items are.
  delta_amount:
    tier: audit-bearing
    source: derived
    rationale: >-
      Signed PO-vs-ERP variance in dollars. Together with
      delta_percentage these are the two numbers the four-eyes
      threshold gate (POLICY_FOUR_EYES_THRESHOLD) reads against.
  delta_percentage:
    tier: audit-bearing
    source: derived
    rationale: >-
      PO-vs-ERP variance as a percentage of ERP price. Used in
      conjunction with delta_amount.
  fulfillment_gap_pct:
    tier: contextual
    source: derived
    rationale: >-
      Optional fulfilment gap as a percentage. Present only when
      line items carry fulfilled_quantity; absence is structural,
      not a partial-truth.
  sla_priority:
    tier: audit-bearing
    source: derived
    rationale: >-
      Coarse SLA priority label (P1-P4). Presentation mapping over
      shadow_verdict + lifecycle; the deterministic source values
      are themselves audit-bearing, so the projection inherits.
  sla_deadline:
    tier: contextual
    source: backend-gap
    rationale: >-
      Wall-clock SLA deadline. No producer wired today; tracked
      under ImpactMetrics grandfather clause. Reclassify once a
      contract-SLA gateway populates the deadline.
  affected_lines:
    tier: audit-bearing
    source: derived
    rationale: >-
      Number of line items in scope of the resolution. Drives the
      operator's review checklist; trivially derived from the
      line-items list, MUST agree with it.

grandfather_clauses:
  # entity_profile_master_gap (added 2026-05-02): customer_tier ships
  # from the seed Account table today, but vip_status, credit_standing,
  # and location have no producer. The fields stay declared so the UI
  # can render them once a customer-master gateway lands.
  # Deadline: 2026-08-01 (re-evaluate at next compliance workshop).

  # impact_metrics_sla_gap (added 2026-05-02): sla_deadline is
  # declared but unpopulated until the contract-SLA gateway lands.
  # Deadline: 2026-08-01.

  # price_analysis_gateway_gap retired (T4, 2026-04-22): SAP doc /
  # contract / promotion gateways are wired on
  # PriceAdjustmentRecipe; doc_type / doc_number / rule_id /
  # root_cause_category persist as audit-bearing via
  # enrichment_context. contract_ref / promotion_ref reclassified to
