# Audit-Bearing Field Registry
#
# Authoritative classification of every field on every `*AnalysisData`
# Pydantic model in `api/schemas.py`. Classifications are consumed by
# the `build_analysis` composition node: when a field is marked
# `tier: audit-bearing` and its value is absent at composition time,
# the node sets `final_status = AUDIT_CONTEXT_MISSING` (distinct from
# FAIL_TO_HUMAN) so the auditor sees a structured, named failure.
#
# Source of truth — see `compliance/audit_bearing_registry.md` for the
# workshop minutes (2026-04-22) that produced this file. Every row
# below carries either:
#   * `source: shadow-policy` — field feeds a `policy_hits` in
#     `constraints/fallback_backend.py`. Q1 of the classification
#     test. Auto-audit-bearing; no discussion required.
#   * `source: recipe-input` — field is a deterministic-branch input
#     to the recipe. Q3. Auto-audit-bearing.
#   * `source: control` — field is named in a SOX §404 control
#     narrative, four-eyes gate (`POLICY_FOUR_EYES_THRESHOLD` per
#     `contracts/policy.py:102-107`), SoD routing rule, or other
#     policy document. Q2. Requires compliance sign-off on
#     classification.
#   * `source: derived` — field is a regenerable projection of other
#     audit-bearing fields (e.g., human-readable reason text).
#     Contextual by default.
#   * `source: decorative` — free-text / plumbing / provenance-only.
#     Contextual.
#
# Tier vocabulary:
#   * `audit-bearing`  — MUST be populated at composition time.
#                        Missing → AUDIT_CONTEXT_MISSING terminal.
#   * `conditional`    — audit-bearing only when `depends_on`
#                        predicate holds. Contextual otherwise.
#                        Example: `alternate_warehouses` is required
#                        iff the reviewer's resolved_action == ALT_DC.
#   * `contextual`     — Layer 2 evidence. May be absent; the UI
#                        structurally omits the row (never "—").
#
# Ownership — this file is owned by the Compliance team via
# CODEOWNERS (path rule pending). Any PR that adds a field to a
# `*AnalysisData` Pydantic model must also add a row here in the same
# PR; a pytest in `tests/test_audit_registry_coverage.py` enforces
# complete coverage and fails CI if a field is added without a
# classification.
#
# Grandfather clauses — fields flagged `status: backend-gap` are
# classified audit-bearing by compliance intent, but no current
# gateway/recipe populates them. The `build_analysis` node treats
# these fields as contextual until the grandfather deadline. After
# that date, missing values route the exception to
# AUDIT_CONTEXT_MISSING. See `grandfather_clauses` section at the
# bottom.
#
# Workshop attendees (digital twins): Dana (Compliance — veto),
# Priya (Product), Ben (Backend), Ulla (UI). Chair: Platform.

version: 1
authored: 2026-04-22
owners:
  - team: compliance   # holds veto on any tier change
  - team: platform     # owns schema + composition-node enforcement

conventions:
  # Every recipe produces one of these. Always audit-bearing.
  # Adding a new recipe automatically inherits this rule; the
  # registry row is still required for field-name provenance.
  always_audit_bearing_field_names:
    - action
    - recommended_action
    - classification

# ---------------------------------------------------------------------------
# Section registry — one block per `*AnalysisData` Pydantic class.
# ---------------------------------------------------------------------------

PriceHoldAnalysisData:
  hold_status:
    tier: audit-bearing
    source: recipe-output
    rationale: >-
      Record state the reviewer is acting on — authorization applies
      to a held order vs. a released one. §404.
  po_price:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [PRICE_HOLD_INVALID_BASE, PRICE_HOLD_HARD_BLOCK, PRICE_HOLD_TOLERANCE_ESCALATE, PRICE_HOLD_TOLERANCE_OK]
  sap_base_price:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [PRICE_HOLD_INVALID_BASE, PRICE_HOLD_HARD_BLOCK, PRICE_HOLD_TOLERANCE_ESCALATE, PRICE_HOLD_TOLERANCE_OK]
  variance_pct:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [PRICE_HOLD_HARD_BLOCK, PRICE_HOLD_TOLERANCE_ESCALATE]
    derivation: (po_price - sap_base_price) / sap_base_price
  tolerance_pct:
    tier: audit-bearing
    source: recipe-input
    rationale: Policy threshold the variance is measured against.
  hard_block_pct:
    tier: audit-bearing
    source: recipe-input
    rationale: Policy floor above which recipe returns HARD_BLOCK.
  action:
    tier: audit-bearing
    source: recipe-output
    rationale: The authorization itself (AUTO_RELEASE / ESCALATE / HARD_BLOCK).
  reason:
    tier: contextual
    source: derived
    rationale: Human-readable; regenerable from variance + thresholds.

EmailSourceData:
  # ADR-034 Phase G — email source-of-truth substrate the operator
  # consumes when authorising an email-channel order. Sourced from
  # the email_intake/fetch_message gateway response (gateway-backed,
  # required_for_audit=True) via enrichment_context.email_source_context.
  # Pillar 1: present on every email-channel record regardless of
  # shadow verdict (gateway READS run before shadow_audit per ADR-025).
  from_address:
    tier: audit-bearing
    source: control
    gateway_dependency: true
    rationale: >-
      Sender of the inbound email. Substrate of the sender_authorized
      floor check; the operator must see the address the floor check
      was applied to.
  received_at:
    tier: audit-bearing
    source: control
    gateway_dependency: true
    rationale: >-
      ISO-8601 receipt timestamp. Substrate for SLA-deadline
      derivation downstream and for the audit trail's chronology.
  subject:
    tier: audit-bearing
    source: control
    gateway_dependency: true
    rationale: >-
      Email subject line. Reviewer cannot triage whether the
      extracted PO matches the buyer's stated intent without seeing
      the subject the agent acted on.
  body_hash:
    tier: audit-bearing
    source: control
    gateway_dependency: true
    rationale: >-
      SHA-256 of the canonicalised email body. Lets the audit trail
      detect post-hoc tampering of the inbound payload without
      storing PII-shaped body content in the registry.
  attachment_manifest:
    tier: audit-bearing
    source: control
    gateway_dependency: true
    rationale: >-
      List of (name, mime_type, bytes) for every attachment the
      extraction pipeline saw. Reviewer authorising a multi-attachment
      PO needs the manifest to confirm scope.
  body_excerpt:
    tier: contextual
    source: derived
    rationale: >-
      Optional human-readable excerpt of the email body — typically
      the first 240 chars after canonicalisation. Decorative when
      absent (redaction policy may strip PII or the body may be
      unavailable); the audit trail reads from `body_hash`.
  source_email_id:
    tier: contextual
    source: control
    rationale: >-
      Optional Inbox correlation id (ADR-034 Phase G — bidirectional
      deep-link between /inbox NEW_ORDER rows and /exceptions/{id}).
      Decorative: when absent, the inline EmailSourceSection on the
      detail page is the primary surface; when present, the detail
      page surfaces a "View source email" back-link.

EmailOrderEntryAnalysisData:
  # ADR-034 Phase B — email-channel order intake. Floor evidence
  # (sender_authorized / customer_resolved / duplicate_po_clear /
  # credit_clear) is sourced from the email_intake gateway's four
  # required_for_audit=True operations and projected into
  # `floor_status` by adapt_email_order_entry. Gateway-backed status:
  # stub-only in V1 (real upstream connectors are a separate
  # platform track); see grandfather_clauses below.
  composite_confidence:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [EMAIL_ORDER_AUTO_APPROVE_BAND, EMAIL_ORDER_REVIEW_BAND, EMAIL_ORDER_LOW_CONFIDENCE_BAND]
    rationale: >-
      Composite extraction + resolution score that drives the
      classification band. Reviewer cannot authorise the action without
      seeing the score the agent acted on.
  classification:
    tier: audit-bearing
    source: recipe-output
    rationale: >-
      Confidence-band classification (ONE_CLICK_APPROVE / STANDARD_REVIEW /
      LOW_CONFIDENCE / FATAL_REJECT). Drives the autonomy ladder and
      SoD routing.
  recommended_action:
    tier: audit-bearing
    source: recipe-output
    rationale: Authorization vocabulary; member of AllowedResolutionAction.
  autonomy_level:
    tier: audit-bearing
    source: control
    rationale: Names the L1/L2/L3 control tier — §404 cites these explicitly.
  validation_failures:
    tier: contextual
    source: recipe-input
    rationale: >-
      Typed failure codes from the validation suite. Decorative
      when absent (clean orders pass with an empty list — which the
      composer's `_populated` rule treats as absent). When the list
      is populated the codes drive the decision tree (clarification-
      class vs auto-correctable vs escalate); the *resulting decision*
      surfaces audit-bearing on classification + recommended_action.
  floor_breaches:
    tier: contextual
    source: recipe-output
    derivation: >-
      Names of the non-disable-able floor checks that breached;
      empty when all four passed. The audit-bearing surface for
      "did any floor check fail" is `floor_status` (always-populated
      4-boolean Pydantic model). `floor_breaches` is the contextual
      detail surfaced when the breach list is non-empty.
  floor_status:
    tier: audit-bearing
    source: control
    gateway_dependency: true
    rationale: >-
      The four non-disable-able floor booleans (sender_authorized,
      customer_resolved, duplicate_po_clear, credit_clear). Gateway-
      sourced via the email_intake gateway (4 operations, all
      required_for_audit=True). Pillar 1: present even on RED-shadowed
      records because gateway READS run before shadow_audit (ADR-025).
  reject_reason_code:
    tier: conditional
    depends_on: classification == FATAL_REJECT
    source: recipe-output
    rationale: >-
      Closed reject-reason vocabulary (sender_unauthorized /
      customer_unresolved / duplicate_po_confirmed / credit_block /
      corrupt_input / policy_floor_breach). Required when the
      classification routes to FATAL_REJECT; absent (and rendered as
      "Context Not Required for Resolution") on every other band.
  notification_template:
    tier: contextual
    source: decorative
    rationale: Downstream email plumbing; zero audit content.

EdiMismatchAnalysisData:
  sub_type:
    tier: audit-bearing
    source: shadow-policy
    policy_hits: [EDI_SKU_MISMATCH_HARD_REJECT, EDI_SHIP_TO_ESCALATE, EDI_QTY_MISMATCH_REVIEW, EDI_UOM_MISMATCH_REVIEW, EDI_UNKNOWN_SUB_TYPE]
  classification:
